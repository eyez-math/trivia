3|מה פירוש הביטוי "לחצות את הרוביקון"?|לקבל החלטה שאין ממנה חזרה|לטייל באיטליה|לשבור הבטחה|להתחיל מסע|יוליוס קיסר חצה עם צבאו את נהר הרוביקון, וכך יצא למלחמת אזרחים.
3|מהו "מנטור", ומאין השם?|מדריך ויועץ, על שם דמות באודיסיאה|מורה למתמטיקה, על שם מדען|מאמן כושר, על שם ספורטאי|שופט, על שם מלך|מנטור היה החבר שאודיסאוס הפקיד בידיו את חינוך בנו.
3|מה פירוש הביטוי "צחוק הומרי"?|צחוק רם ובלתי נשלט|צחוק עצוב|צחוק שקט|צחוק מזויף|באפוסים של הומרוס, האלים פורצים בצחוק סוער.
3|מהי המילה העברית שקבעה האקדמיה ללשון במקום "פודקאסט"?|הסכת|שמעון|תכנית|קולית|מהשורש ס־כ־ת, להקשיב, כמו בפסוק "הסכת ושמע".
3|מהי המילה העברית שקבעה האקדמיה ללשון במקום "ג'ט לג"?|יעפת|טיסון|עייפות|זמנת|מהשורש י־ע־ף, עייפות. כמו "חרדת" או "שפעת", המשקל הזה מתאר מצב גופני.
3|מאיזה סיפור מקראי הגיעה המילה "שיבולת" כסימן היכר?|הגלעדים זיהו את בני אפרים לפי הגייתם|יוסף ואחיו|דוד וגוליית|שמשון והפלשתים|בני אפרים אמרו "סיבולת" ונחשפו (ספר שופטים). באנגלית shibboleth הפכה למילה לסימן היכר.
3|מה פירוש הביטוי "אוי לי מיוצרי ואוי לי מיצרי"?|כל בחירה במצב הזה תהיה רעה|אני מצטער מאוד|אני כועס על הוריי|אני עייף מאוד|המקור בתלמוד: מצב שבו כל דרך פעולה מביאה נזק.
3|מה פירוש הביטוי "בל יראה ובל ימצא"?|לא יישאר שום זכר|שמירת סוד|מקום נסתר|אסור להסתכל|המקור בדיני חמץ בפסח. היום נאמר על דבר שנעלם לגמרי.
3|מה פירוש הביטוי "תפסת מרובה – לא תפסת"?|מי שמנסה להשיג יותר מדי, לא משיג כלום|צריך לתפוס הרבה|מי שמהיר מנצח|עדיף לחלוק|המקור בתלמוד.
3|מה פירוש הביטוי "הרים את קרנו"?|חיזק את מעמדו|נלחם|כעס|ניגן בשופר|הקרן מסמלת בתנ״ך כוח ומעמד, כמו קרן של שור.
3|מי אמר "אם אין אני לי, מי לי"?|הלל הזקן|שמאי|רבי עקיבא|משה רבנו|ההמשך: "וכשאני לעצמי – מה אני? ואם לא עכשיו – אימתי?" (פרקי אבות).
3|מה פירוש הביטוי "דרך ארץ קדמה לתורה"?|התנהגות ראויה באה עוד לפני הלימוד|צריך לטייל לפני שלומדים|העבודה חשובה מהלימוד|הארץ קדמה לעם|המקור במדרש. "דרך ארץ" פירושה נימוס והתנהגות טובה.
3|מה פירוש הביטוי "סייג לחכמה – שתיקה"?|שתיקה היא סימן לחוכמה|אסור לדבר בזמן לימוד|חכם לא צריך ללמוד|מי ששותק מפסיד|המקור בפרקי אבות.
3|מה פירוש הביטוי "לא עליך המלאכה לגמור"?|אין חובה לסיים הכול, אבל חובה להתחיל|אין צורך לעבוד|מישהו אחר יעשה את זה|העבודה לא חשובה|ההמשך: "ולא אתה בן חורין להיבטל ממנה" (רבי טרפון, פרקי אבות).
3|מהו אדם "פדנט"?|אדם שמקפיד על פרטים קטנים באופן מוגזם|אדם עצלן|אדם נדיב|אדם מצחיק|למשל, מי שמתקן כל פסיק קטן בהודעה.
3|מהו "אנכרוניזם"?|דבר שאינו מתאים לתקופה שבה הוא מופיע|מחלה נדירה|שעון עתיק|מילה בלועזית|למשל, אביר מימי הביניים עם שעון יד בסרט.
3|מהו "פלגיאט"?|העתקת יצירה של אחר והצגתה כשלך|ציור קיר|מחלה של צמחים|מכתב רשמי|מקור המילה בלטינית, במילה שפירושה חוטף.
3|מהו "אוקסימורון"?|צירוף של מילים סותרות, כמו "שקט רועם"|מילה עם שתי משמעויות|חזרה על אותה מילה|מילה ארוכה במיוחד|ביוונית: "חד" ו"טיפש" יחד, כלומר המונח עצמו הוא אוקסימורון.`
};
const CATEGORIES=[{id:'world',name:'מסביב לעולם',icon:'🌍',color:'#2fbdcb'},{id:'culture',name:'סרטים ומוזיקה',icon:'🎬',color:'#ed67af'},{id:'sports',name:'ספורט ומשחקים',icon:'🏆',color:'#f6b74b'},{id:'science',name:'מדע וטבע',icon:'🔬',color:'#72d9a5'},{id:'history',name:'היסטוריה וישראל',icon:'🏛️',color:'#a58cff'},{id:'lang',name:'שפה וביטויים',icon:'💬',color:'#ff827b'}];
</script><script>
const app=document.querySelector('#app'),$=s=>document.querySelector(s),COLORS=['#7294a8','#bd918e','#82a493','#b9a36e'];
const LEVELS=[{id:1,name:'קל',pts:100},{id:2,name:'בינוני',pts:200},{id:3,name:'קשה',pts:300}];
const BANK=Object.entries(RAW).flatMap(([cat,raw])=>raw.trim().split('\n').map((line,i)=>{const [lv,q,correct,...rest]=line.split('|');return{id:`${cat}-${i}`,cat,q,correct,answers:[correct,...rest.slice(0,3)],level:Number(lv),exp:rest[3]||''}}));
let teams=[],turn=0,round=1,phase='setup',cat=null,level=1,current=null,used=new Set(),remaining=20,ticker=null,paused=false,selected=null,revealed=false,status='',gameTime=20,penalty=false,stealOn=true,maxRounds=0,stealer=null,wrongPick=null,stealStatus='';
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(txt,fn,cls='ghost',disabled=false)=>`<button class="${cls}" ${disabled?'disabled':''} onclick="${fn}">${txt}</button>`;
const pts=()=>LEVELS.find(d=>d.id===level).pts;
function shuffle(items){let a=[...items];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stopTimer(){if(ticker){clearInterval(ticker);ticker=null}}
function render(){stopTimer();let sections={setup,category:categories,difficulty:difficulties,question,end:results};app.innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="logo">✦</div>טריוויה <span class="brand-accent">קלאסיק</span></div>${phase==='setup'?'<span class="pill">מהדורת ט׳–י״ב</span>':button('סיום משחק','finish()')}</header>${!['setup','end'].includes(phase)?board():''}${sections[phase]()}<footer class="bottom"><span>${BANK.length} שאלות · ${CATEGORIES.length} נושאים · שאלות אינן חוזרות באותו משחק</span><span class="keys">מקלדת: 1–4 תשובה · רווח עצירה · Enter המשך</span></footer></div>`;if(phase==='question'&&!revealed&&!paused&&remaining>0)startTimer()}
function setup(){return `<section class="intro"><span class="eyebrow">שעשועון ידע קבוצתי</span><h1>מי יהיו <em>אלופי הטריוויה?</em></h1><p>בוחרים נושא, עונים בזמן וצוברים נקודות.</p></section><section class="panel setup"><div class="label">מספר הקבוצות</div><div class="controls">${[2,3,4].map(n=>button(`${n} קבוצות`,`setCount(${n})`,teams.length===n?'primary':'pill')).join('')}</div><div class="label">שמות הקבוצות</div><div class="teams-edit">${teams.map((t,i)=>`<label class="team-edit"><span class="swatch" style="background:${t.color}"></span><input aria-label="שם קבוצה ${i+1}" value="${esc(t.name)}" oninput="teams[${i}].name=this.value" maxlength="22"></label>`).join('')}</div><div class="controls options"><label>זמן לשאלה <select id="time"><option value="15">15 שניות</option><option value="20" selected>20 שניות</option><option value="30">30 שניות</option><option value="45">45 שניות</option></select></label><label>תשובה שגויה <select id="penalty"><option value="0">ללא ניקוד</option><option value="1">הפחתת חצי מהנקודות</option></select></label><label>גניבה <select id="steal"><option value="1" selected>הקבוצה הבאה יכולה לגנוב חצי</option><option value="0">ללא גניבה</option></select></label><label>אורך המשחק <select id="rounds"><option value="0">ללא הגבלה</option><option value="3">3 סבבים</option><option value="5" selected>5 סבבים</option><option value="8">8 סבבים</option><option value="10">10 סבבים</option></select></label></div><div class="cta">${button('בואו נתחיל ←','startGame()','primary')}</div></section>`}
function setCount(n){teams=Array.from({length:n},(_,i)=>teams[i]||{name:['הכחולים','האדומים','הירוקים','הצהובים'][i],color:COLORS[i],score:0});render()}
function startGame(){teams=teams.map((t,i)=>({...t,name:t.name.trim()||`קבוצה ${i+1}`,score:0}));gameTime=Number($('#time').value);penalty=$('#penalty').value==='1';stealOn=$('#steal').value==='1';maxRounds=Number($('#rounds').value);turn=0;round=1;used.clear();phase='category';render()}
function board(){return `<div class="scoreboard" style="--count:${teams.length}">${teams.map((t,i)=>`<div class="score ${turn===i?'active':''} ${stealer===i&&!revealed?'stealing':''}" style="--accent:${t.color}"><span class="score-marker"></span><small>${turn===i?'עכשיו תורכם':stealer===i&&!revealed?'🎯 ניסיון גניבה':'קבוצה '+(i+1)}</small><h3>${esc(t.name)}</h3><div><strong>${t.score}</strong> <span>נק׳</span></div><div class="score-actions">${button('−100',`adjust(${i},-100)`,'mini')}${button('+100',`adjust(${i},100)`,'mini')}</div></div>`).join('')}</div>`}
function adjust(i,n){teams[i].score+=n;render()}
function categories(){return `<section class="panel game-stage"><div class="section-head"><span class="eyebrow">סיבוב ${round}${maxRounds?` מתוך ${maxRounds}`:''}</span><h1>${esc(teams[turn].name)}, בחרו נושא</h1><p>לאיזה עולם ידע נצא?</p></div><div class="categories">${CATEGORIES.map(c=>{let n=BANK.filter(q=>q.cat===c.id&&!used.has(q.id)).length;return `<button class="category" style="--accent:${c.color}" onclick="pickCat('${c.id}')" ${!n?'disabled':''}><span class="emoji">${c.icon}</span><strong>${c.name}</strong><small>${n} שאלות זמינות</small></button>`}).join('')}</div></section>`}
function pickCat(id){if(!BANK.some(q=>q.cat===id&&!used.has(q.id)))return;cat=id;phase='difficulty';render()}
function difficulties(){const c=CATEGORIES.find(x=>x.id===cat);return `<section class="panel game-stage"><div class="section-head"><span class="eyebrow">${c.icon} ${c.name}</span><h1>בחרו רמת קושי</h1><p>ככל שהשאלה קשה יותר, כך היא שווה יותר נקודות.</p></div><div class="difficulty">${LEVELS.map(d=>{let n=BANK.filter(q=>q.cat===cat&&q.level===d.id&&!used.has(q.id)).length;return `<button class="diff" onclick="pickDiff(${d.id})" ${!n?'disabled':''}><span>${d.name}</span><strong>${d.pts}</strong><small>נקודות · ${n} שאלות</small></button>`}).join('')}</div><div class="cta">${button('חזרה לנושאים','backCats()')}</div></section>`}
function backCats(){phase='category';render()}
function pickDiff(n){level=n;let pool=BANK.filter(q=>q.cat===cat&&q.level===n&&!used.has(q.id));if(!pool.length)return;current=pool[Math.floor(Math.random()*pool.length)];used.add(current.id);current.options=shuffle(current.answers);selected=null;wrongPick=null;stealer=null;stealStatus='';revealed=false;status='';remaining=gameTime;paused=false;phase='question';render()}
function startTimer(){ticker=setInterval(()=>{if(paused||revealed)return;remaining=Math.max(0,remaining-1);let el=$('#timeCircle');if(el){el.textContent=remaining;el.classList.toggle('low',remaining<=5)}if(remaining===0){stealer!==null?stealResult('timeout'):complete('timeout')}},1000)}
function feedback(){const c=current.correct,p=pts();if(!revealed&&stealer!==null)return `<div class="feedback steal" role="status"><strong>${status==='timeout'?'⏰ הזמן נגמר':'✕ תשובה שגויה'}</strong><span>${esc(teams[stealer].name)} – הזדמנות לגנוב ${p/2} נקודות!</span></div>`;if(!revealed)return '';let cls,title,text;if(status==='correct'){cls='success';title='✓ תשובה נכונה!';text=`נוספו ${p} נקודות לקבוצת ${esc(teams[turn].name)}`}else if(stealStatus==='stolen'){cls='success';title='🎯 גניבה מוצלחת!';text=`נוספו ${p/2} נקודות לקבוצת ${esc(teams[stealer].name)}`}else{cls='error';title=status==='passed'?'⏭ התור הועבר':status==='timeout'?'⏰ הזמן נגמר':'✕ תשובה שגויה';text=`${stealStatus==='failed'||stealStatus==='timeout'?'גם הגניבה לא הצליחה · ':''}התשובה הנכונה: ${esc(c)}`}return `<div class="feedback ${cls}" role="status"><strong>${title}</strong><span>${text}</span></div>${current.exp?`<div class="explain">💡 ${esc(current.exp)}</div>`:''}`}
function question(){let c=CATEGORIES.find(x=>x.id===cat),d=LEVELS.find(x=>x.id===level);return `<section class="panel game-stage question-panel"><div class="question-top"><span class="tag">${c.icon} ${c.name} · ${d.name} · ${d.pts} נק׳</span><span id="timeCircle" class="timer ${remaining<=5?'low':''} ${paused?'paused':''}">${remaining}</span></div><div class="question">${esc(current.q)}</div><div class="answers">${current.options.map((a,i)=>{let good=a===current.correct,bad=selected===i||wrongPick===i,cls=revealed?(good?'correct':bad?'wrong':''):(wrongPick===i?'wrong':'');return `<button class="answer ${cls}" onclick="choose(${i})" ${revealed||wrongPick===i?'disabled':''}><span class="letter">${['א','ב','ג','ד'][i]}</span><span>${esc(a)}</span>${revealed&&good?'<b class="answer-icon">✓</b>':''}${(revealed||wrongPick===i)&&bad&&!good?'<b class="answer-icon">✕</b>':''}</button>`}).join('')}</div>${feedback()}<div class="question-actions">${revealed?button('לתור הבא ←','nextTurn()','primary'):button(paused?'▶ המשך שעון':'Ⅱ עצור שעון','pauseTimer()','secondary')+(stealer!==null?button('ללא גניבה','stealResult(\'skip\')'):button('העבר תור','passTurn()'))}</div></section>`}
function choose(i){if(revealed||phase!=='question'||i===wrongPick)return;if(stealer!==null){selected=i;stealResult(current.options[i]===current.correct?'correct':'failed');return}selected=i;complete(current.options[i]===current.correct?'correct':'wrong')}
function complete(result){if(revealed||stealer!==null)return;stopTimer();paused=false;status=result;const p=pts();if(result==='correct'){teams[turn].score+=p;revealed=true;return render()}if(penalty)teams[turn].score-=p/2;if(stealOn&&teams.length>1){stealer=(turn+1)%teams.length;wrongPick=selected;selected=null;remaining=Math.min(10,gameTime);return render()}revealed=true;render()}
function stealResult(r){if(revealed||stealer===null)return;stopTimer();paused=false;stealStatus=r==='correct'?'stolen':r;if(r==='correct')teams[stealer].score+=pts()/2;revealed=true;render()}
function pauseTimer(){paused=!paused;render()}
function passTurn(){if(revealed)return;stopTimer();status='passed';revealed=true;render()}
function nextTurn(){stopTimer();stealer=null;turn=(turn+1)%teams.length;if(turn===0)round++;if(maxRounds&&round>maxRounds){phase='end';return render()}phase='category';render()}
function finish(){if(confirm('לסיים את המשחק ולהציג את התוצאות?')){phase='end';render()}}
function results(){let sorted=[...teams].sort((a,b)=>b.score-a.score);return `<section class="panel result"><span class="eyebrow">סיום המשחק · ${used.size} שאלות</span><h1>🏆 יש לנו אלופים!</h1><p>כל הכבוד לכל הקבוצות!</p><div class="podium">${sorted.map((t,i)=>`<div class="rank"><span>${['🥇','🥈','🥉','🏅'][i]} ${esc(t.name)}</span><strong>${t.score} נק׳</strong></div>`).join('')}</div>${button('משחק חדש','restart()','primary')}</section>`}
function restart(){phase='setup';render()}
document.addEventListener('keydown',e=>{if(e.target.matches('input,select')||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;if(phase==='question'){if(/^[1-4]$/.test(k))choose(Number(k)-1);else if(k===' '&&!revealed){e.preventDefault();pauseTimer()}else if(k==='Enter'&&revealed){e.preventDefault();nextTurn()}}else if(phase==='category'&&/^[1-6]$/.test(k)){const c=CATEGORIES[Number(k)-1];if(c)pickCat(c.id)}else if(phase==='difficulty'){if(/^[1-3]$/.test(k))pickDiff(Number(k));else if(k==='Escape')backCats()}});
setCount(2);

</script></body></html>
